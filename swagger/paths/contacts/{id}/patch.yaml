tags:
  - Contacts
summary: Update contact
operationId: updateContact

#Request
description: 'Update a contact'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object        
        properties:
          photo:
            description: "Contact's photo"
            type: string
            format: binary
          name:
            description: "Contact's name"
            type: string
            example: 'Dmitrii Dmitrichenko'
          phoneNumber:
            description: "Contact's phoneNumber"
            type: string
            example: '4502568'
          contactType:
            description: 'Contact type'
            type: string
            enum: ['work', 'home', 'personal']
          email:
            description: "Contact's mail"
            type: string
            example: 'gafg@gmail.com'
          isFavorite:
            description: 'Contact isFavorite'
            type: boolean
            example: false

#Responses
responses:
  '200':
    description: Update a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'