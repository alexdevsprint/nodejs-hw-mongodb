type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId  
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+3809991010'  
  email:
    description: "Contact's email"
    type: string
    example: test@gmail.com
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  isFavourite:
    description: "Is contact favourite?"
    type: boolean
    example: false
  timestamps:
    description: ''
    type: boolean
    example: true
  versionKey:
    description: ''
    type: boolean
    example: false
  userId:
    description: "ID of the user who owns this contact"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png